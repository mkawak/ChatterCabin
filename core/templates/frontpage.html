{% extends 'base.html' %}
{% load static %}
{% block title %}
    Welcome |
{% endblock %}
{% block content %}
    <div id="main-content" class="p-10 lg:p-5 text-center"
         style="
                background: linear-gradient(to right, #383838, #000000);
                display: flex; flex-grow: 1;
                justify-content: center;
                align-items: center;">
        <img src="{% static 'ChatterCabin_logo.png' %}" alt="ChatNest Logo"
             style="max-width: 400px; width: 80%; height: auto;
                    @media (max-width: 600px) { width: 95%; max-height: 50vh; }
                    @media (min-width: 601px) and (max-width: 3000px) { width: 100%; max-height: 80vh; }"
             class="mx-auto block">
    </div>
{% endblock %}
